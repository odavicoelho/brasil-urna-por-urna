[project]
name = "urnaporurna"
version = "0.1.0"
description = "Pipeline do Brasil Urna por Urna: resultado da eleição presidencial de 2026 em cada local de votação."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Davi Coelho", email = "coelhodavi.comercial@gmail.com" }]
dependencies = [
  "duckdb>=1.4",
  "httpx>=0.28",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.22", "ruff==0.17.1", "mypy>=1.14"]

[project.scripts]
urna = "urnaporurna.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urnaporurna"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # tabelas de teste em SQL ficam mais legíveis numa linha só

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["urnaporurna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
