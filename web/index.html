<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Brasil Urna por Urna · O resultado da eleição em cada local de votação</title>
    <meta
      name="description"
      content="Como votou a sua escola? O 2º turno da eleição presidencial de 2026 em cada um dos 92 mil locais de votação do Brasil, com a renda e o perfil do entorno pelo Censo 2022."
    />
    <link rel="canonical" href="https://odavicoelho.github.io/brasil-urna-por-urna/" />
    <link rel="icon" href="icone.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icone-180.png" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Brasil Urna por Urna" />
    <meta property="og:title" content="Como votou a sua escola? A eleição de 2026, local por local" />
    <meta
      property="og:description"
      content="O 2º turno em cada um dos 92 mil locais de votação do Brasil, com a renda do entorno pelo Censo 2022."
    />
    <meta property="og:url" content="https://odavicoelho.github.io/brasil-urna-por-urna/" />
    <meta property="og:image" content="https://odavicoelho.github.io/brasil-urna-por-urna/compartilhar.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mapa do Brasil com os locais de votação coloridos pelo resultado do 2º turno" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- O mínimo para pintar o mapa: começa a baixar antes do JavaScript rodar. -->
    <link rel="preload" href="dados/pontos.bin" as="fetch" crossorigin />
    <link rel="preload" href="dados/brasil.json" as="fetch" crossorigin />
    <link rel="preload" href="dados/meta.json" as="fetch" crossorigin />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <!-- Inter só para quem não tem a fonte do sistema da Apple (Android, Windows). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" />
  </head>
  <body>
    <div id="app">
      <div id="mapa" role="application" aria-label="Mapa dos locais de votação"></div>

      <div id="flutuantes">
        <button id="legenda" class="vidro" type="button" aria-label="Trocar o que o mapa mostra">
          <div class="legenda-topo">Carregando o mapa <span class="girando carregando"></span></div>
        </button>
        <div class="grupo-botoes vidro">
          <button id="botao-camadas" type="button" aria-label="Camadas">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z" /><path d="m3 13 9 5 9-5" /></svg>
          </button>
          <span class="divisor"></span>
          <button id="botao-perto" type="button" aria-label="Locais perto de mim">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5 3.8 10.4a.6.6 0 0 0 .05 1.13l6.6 2.02 2.02 6.6a.6.6 0 0 0 1.13.05L20.5 3.5Z" /></svg>
          </button>
        </div>
      </div>

      <!-- Painel principal: folha de baixo no celular, barra lateral no computador. -->
      <section id="painel" aria-label="Painel">
        <div class="alca" aria-hidden="true"><span></span></div>
        <div class="busca-linha">
          <label class="campo-busca">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4 4" /></svg>
            <input id="busca-campo" type="search" enterkeyhint="search" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="Buscar escola, bairro ou cidade" autocomplete="off" />
          </label>
          <button id="busca-cancelar" class="texto-botao" type="button" hidden>Cancelar</button>
        </div>
        <div id="vistas">
          <div id="vista-inicio" class="vista"></div>
          <div id="vista-busca" class="vista" hidden><ul id="busca-resultados"></ul></div>
          <div id="vista-local" class="vista" hidden></div>
        </div>
      </section>
    </div>

    <!-- Cartões que sobem por cima do mapa -->
    <div id="fundo-modal" hidden></div>
    <section id="modal-renda" class="modal" hidden aria-label="Renda e voto" role="dialog"></section>
    <section id="modal-sobre" class="modal" hidden aria-label="Como foi feito" role="dialog"></section>
    <section id="modal-camadas" class="modal modal-pequeno" hidden aria-label="Camadas" role="dialog"></section>

    <div id="aviso" class="vidro" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
